mmfwd:
  instances:
    - mid: # modem identity
        n-own: '.*' # own number, regex. Use all modems
      fwd:
        mailto:
          - jd@example.com
        cmd:
          - /usr/bin/mailx
          - jd@example.com
          - -s Text from {sender}
      call-am:
        enabled: false
        exec: "/usr/local/mmfwd-callam"
        playback: 0
        ringtone-exec:
          - ffplay
          - -loglevel
          - error
          - -autoexit
          - -nodisp
          - ringtone.ogg
